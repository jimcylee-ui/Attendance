<script>

async function sLogin(){
  const p=ph(v('ph')),pin=v('pin');
  if(p.length<9||!/^\d{6}$/.test(pin))return loginView('Enter your phone number and 6-digit PIN.');
  const{error}=await SB.auth.signInWithPassword({email:mail(p),password:pin});
  error?loginView('Phone number or PIN is not correct.'):load();
}
async function cLogin(){
  const{error}=await SB.auth.signInWithPassword({email:v('ce'),password:document.getElementById('cp').value});
  error?loginView('Email or password is not correct.','coach'):load();
}
async function register(){
  const d={first:v('rf'),last:v('rl'),email:v('re'),phone:ph(v('rp')),address:v('ra'),ec_name:v('rn'),ec_phone:ph(v('rc')),health:v('rh')},pin=v('rpin'),bad=m=>loginView(m,'reg');
  if(!d.first||!d.last||!d.address||!d.ec_name)return bad('Please fill in all required fields.');
  if(!/^\S+@\S+\.\S+$/.test(d.email))return bad('Enter a valid email address.');
  if(d.phone.length<9||d.ec_phone.length<9)return bad('Enter valid phone numbers.');
  if(!/^\d{6}$/.test(pin))return bad('The PIN must be exactly 6 digits.');
  if(!document.getElementById('rk').checked)return bad('Please tick the consent box.');
  const{data,error}=await SB.auth.signUp({email:mail(d.phone),password:pin,options:{data:d}});
  if(error)return bad(/regist/i.test(error.message)?'This phone number is already registered. Please log in.':error.message);
  if(!data.session)return bad('Registered, but email confirmation is still on in Supabase. Turn it off, then log in.');
  await load();await doCheckin();
}
async function load(){if(recovering)return;
  const{data:{user}}=await SB.auth.getUser();
  if(!user)return loginView();
  const[p,c]=await Promise.all([SB.from('profiles').select('*').eq('id',user.id).maybeSingle(),SB.from('settings').select('*').single()]);
  prof=p.data;cfg=c.data;
  if(!prof||!cfg)return loginView('Could not load your profile.');
  setHdr();if(prof.role!=='coach'&&!prof.health_v2)return loginView('Please check your details and complete the new health declaration.','prof');prof.role==='coach'?coachView():studentView();
}
async function logout(){await SB.auth.signOut();msg='';date='';loginView()}
async function doCheckin(){
  const{data,error}=await SB.rpc('check_in');
  msg=error?error.message:data==='ok'?'Checked in. Points are added once the coach records your payment.':data;
  studentView();
}

  A.innerHTML=`<div class="card row"><span style="display:flex;align-items:center;gap:10px">${av(prof,44)}<span class="mute">Logged in as <b>${esc(prof.first_name)}</b></span></span><span><button onclick="loginView('','prof')">My details</button> <button onclick="logout()">Log out</button></span></div>
  <div class="card row" style="flex-wrap:nowrap;align-items:stretch"><div id="pa" role="button" tabindex="0" aria-label="Your points. Press and hold to see the leaderboard" style="user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer" onpointerdown="lbStart()" onpointerup="lbCancel()" onpointerleave="lbCancel()" onpointercancel="lbCancel()" oncontextmenu="return false" onkeydown="if(event.key==='Enter')lbShow()"><div class="mute">Your points</div><div class="big">${pt.data||0}</div><div class="mute" style="font-size:12px;margin-top:4px">Hold to see leaderboard</div></div>${bar}</div>

async function coachView(){
  const d=date||today();
  const[st,ci,pa,pl,it,sl,rw,rd,bn]=await Promise.all([SB.from('profiles').select('*').eq('role','student').order('first_name'),SB.from('checkins').select('*'),SB.from('payments').select('*'),SB.from('plans').select('*'),SB.from('items').select('*').order('name'),SB.from('sales').select('*'),SB.from('rewards').select('*').order('cost'),SB.from('redeems').select('*').order('created_at',{ascending:false}),SB.from('bonus').select('*').order('created_at',{ascending:false}).limit(8)]);

  const sum=f=>{const t={cash:0,bank_in:0,tng:0,fees:0,plans:0,drinks:0},add=(m,a,k)=>{if(t[m]!==undefined){t[m]+=+a;t[k]+=+a}};P.filter(p=>f(p.class_date)).forEach(p=>add(p.method,p.amount,'fees'));PL.filter(p=>f(p.paid_on)).forEach(p=>add(p.method,p.amount,'plans'));SA.filter(x=>x.method&&f(x.paid_on||x.sale_date)).forEach(x=>add(x.method,x.amount,'drinks'));return t};
  const card=(title,f)=>{const t=sum(f);return `<div class="card"><div class="row"><b>${title}</b><b>${rm(t.cash+t.bank_in+t.tng)}</b></div><div class="mute">Cash ${rm(t.cash)}, Bank-in ${rm(t.bank_in)}, TNG ${rm(t.tng)}</div><div class="mute">Class fees ${rm(t.fees)}, monthly plans ${rm(t.plans)}, drinks ${rm(t.drinks)}</div></div>`};
  const rows=S.map(s=>{
    const plan=PL.some(x=>x.student_id===s.id&&x.month===mon(d)),here=C.some(c=>c.student_id===s.id&&c.class_date===d),ps=P.filter(p=>p.student_id===s.id&&p.class_date===d);
    const det=`<details style="margin-top:8px"><summary class="mute dt" style="cursor:pointer;font-size:16px;padding:6px 0"><span class="arr">▶</span>Contact, emergency and health details</summary><div class="mute" style="margin-top:6px;line-height:1.7">Contact: <a href="tel:${esc(s.phone)}">${esc(s.phone)}</a><br>Email: ${esc(s.email)}<br>Address: ${esc(s.address)}<br>Emergency: ${esc(s.ec_name)}, <a href="tel:${esc(s.ec_phone)}">${esc(s.ec_phone)}</a><br>Health: ${healthTxt(s)}<div class="pay"><input id="np${s.id}" type="password" inputmode="numeric" maxlength="6" placeholder="New PIN (6 digits)" style="width:150px"><button onclick="resetLogin('${s.id}')">Reset PIN</button></div>${prof.is_master?`<div class="pay"><button onclick="if(confirm('Delete this student? Their payment history is kept, but their check-ins, points and details are removed.'))rpcRun('delete_student',{p_id:'${s.id}'})">Delete student</button></div>`:''}</div></details>`;
    let h=`<div class="card"><span style="display:flex;align-items:center;gap:8px">${av(s,36)}<b>${esc(s.first_name)} ${esc(s.last_name)} <span class="mute">${esc(s.phone)}</span></b></span>${det}<div class="row" style="margin-top:10px">`;
    if(!here)h+=`<span><span class="tag w">Absent</span> <button onclick="act('in','${s.id}')">Mark present</button></span></div>`;

      h+=plan&&!ps.length?'<div class="row" style="margin-top:8px"><span class="tag">Monthly plan: no payment needed</span></div>':ps.length?`<div class="row" style="margin-top:8px"><span class="tag">Paid ${rm(ps.reduce((a,p)=>a+ +p.amount,0))} by ${ps.map(p=>ML[p.method]).join(', ')}</span><button onclick="act('unpay','${s.id}')">Remove payment</button></div>`:`<div class="pay"><input id="a${s.id}" type="number" step="0.5" value="${feeFor(rd.data||[],d,s.id)}" aria-label="Amount"><select id="m${s.id}" aria-label="Method"><option value="cash">Cash</option><option value="bank_in">Bank-in</option><option value="tng">TNG</option><option value="reward">Free (guest pass)</option></select><button class="p" onclick="act('pay','${s.id}')">Record payment</button></div>`}
    return h+'</div>'}).join('');
  A.innerHTML=collapsify(`<div class="card row"><b>${esc(cfg.class_name)} (Coach)</b><span><button onclick="loginView('','prof')">My details</button> <button onclick="logout()">Log out</button></span></div>
  ${prof.health_v2?'':'<div class="msg">Please complete your details. <button onclick="loginView(\'\',\'prof\')">Complete now</button></div>'}

async function register2(mode){
  const c=mode==='creg',bad=(m,ids)=>showErr(m,ids),pw=c?document.getElementById('rpin').value:v('rpin');
  const d={first:v('rf'),last:v('rl'),email:v('re'),phone:ph(v('rp')),address:v('ra'),ec_name:v('rn'),ec_phone:ph(v('rc')),health_yes:hyAns(),health_other:v('rh')};
  if(!c&&document.getElementById('rref'))d.ref=ph(v('rref'));
  const need=[['rf',d.first],['rl',d.last],['ra',d.address],['rn',d.ec_name],['re',/^\S+@\S+\.\S+$/.test(d.email)],['rp',d.phone.length>=9],['rc',d.ec_phone.length>=9],['rpin',c?pw.length>=8:/^\d{6}$/.test(pw)],['rk',document.getElementById('rk').checked]];
  if(c)need.push(['rcode',!!v('rcode')]);
  const miss=need.filter(x=>!x[1]).map(x=>x[0]);
  if(miss.length)return showErr('Please complete the highlighted fields.'+(miss.includes('rpin')?(c?' The password needs at least 8 characters.':' The PIN must be exactly 6 digits.'):'')+(miss.includes('rp')||miss.includes('rc')?' Phone numbers need at least 9 digits.':''),miss);
  if(!d.first||!d.last||!d.address||!d.ec_name)return bad('Please fill in all required fields.');
  if(!/^\S+@\S+\.\S+$/.test(d.email))return bad('Enter a valid email address.');
  if(d.phone.length<9||d.ec_phone.length<9)return bad('Enter valid phone numbers.');
  if(c?pw.length<8:!/^\d{6}$/.test(pw))return bad(c?'The password needs at least 8 characters.':'The PIN must be exactly 6 digits.');
  if(!document.getElementById('rk').checked)return bad('Please tick the confirmation box.');
  if(c){d.coach_code=v('rcode');const ok=await SB.rpc('check_invite',{p:d.coach_code});if(!ok.data)return bad('The invite code is not correct.',['rcode'])}
  const{data,error}=await SB.auth.signUp({email:c?d.email:mail(d.phone),password:pw,options:{data:d}});
  if(error)return bad(/regist/i.test(error.message)?'This '+(c?'email':'phone number')+' is already registered. Please log in.':error.message,[c?'re':'rp']);
  if(!data.session)return bad('Registered, but email confirmation is still on in Supabase.');
  const pf0=document.getElementById('rpic').files[0],ex={health_ops:v('rops'),health_allergy:v('ralg'),health_family:v('rfam'),health_disability:v('rdis')};if(pf0){ex.photo=await shrink(pf0);await SB.from('photos').upsert({id:data.user.id,big:await shrink(pf0,480)})}await SB.from('profiles').update(ex).eq('id',data.user.id);await load();if(!c)await doCheckin();
}
async function saveProf(){
  const d={first_name:v('rf'),last_name:v('rl'),phone:ph(v('rp')),address:v('ra'),ec_name:v('rn'),ec_phone:ph(v('rc')),health_yes:hyAns(),health_other:v('rh'),health_ops:v('rops'),health_allergy:v('ralg'),health_family:v('rfam'),health_disability:v('rdis')};
  const np=document.getElementById('rnewpin')?document.getElementById('rnewpin').value:'';
  if(np&&(prof.role==='coach'?np.length<8:!/^\d{6}$/.test(np)))return showErr(prof.role==='coach'?'The new password needs at least 8 characters.':'The new PIN must be exactly 6 digits.',['rnewpin']);
  const need=[['rf',d.first_name],['rl',d.last_name],['ra',d.address],['rn',d.ec_name],['rp',d.phone.length>=9],['rc',d.ec_phone.length>=9],['rk',document.getElementById('rk').checked]],miss=need.filter(x=>!x[1]).map(x=>x[0]);
  if(miss.length)return showErr('Please complete the highlighted fields.',miss);
  const f=document.getElementById('rpic').files[0];if(f){d.photo=await shrink(f);await SB.from('photos').upsert({id:prof.id,big:await shrink(f,480)})}d.health_v2=true;const{error}=await SB.from('profiles').update(d).eq('id',prof.id);if(!error&&np)await SB.auth.updateUser({password:np});error?showErr(error.message):load();
}

async function giveBonus(){const sid=v('bs'),reason=v('br').split('|')[0],p=+v('bp'),m=today().slice(0,7);
  if(!(p>0)){msg='Enter the points.';return coachView()}
  const{data}=await SB.from('bonus').select('pts,bonus_date,is_referral').eq('student_id',sid),used=(data||[]).filter(b=>!b.is_referral&&b.bonus_date.slice(0,7)===m).reduce((a,b)=>a+b.pts,0);

function showErr(m,ids){

  if(!box)return loginView(m);
  box.innerHTML=`<div class="msg">${esc(m)}</div>`;
  document.querySelectorAll('.bad').forEach(e=>e.classList.remove('bad'));
  const els=(ids||[]).map(i=>document.getElementById(i)).filter(Boolean);
  els.forEach(e=>(e.type==='checkbox'?e.closest('label'):e).classList.add('bad'));
  const f=els[0]||box;f.scrollIntoView({behavior:'smooth',block:'center'});

}

async function delSale(id){
  const{data:x}=await SB.from('sales').select('*').eq('id',id).single(),{data:i}=await SB.from('items').select('stock').eq('id',x.item_id).single();
  await SB.from('items').update({stock:i.stock+x.qty}).eq('id',x.item_id);run(SB.from('sales').delete().eq('id',id));
}
async function stock(id,kind){
  const{data:i}=await SB.from('items').select('stock').eq('id',id).single();
  if(kind==='add'){const q=+v('rs'+id);if(!(q>0)){msg='Enter a quantity.';return coachView()}
    await SB.from('stock_log').insert({item_id:id,kind:'restock',qty:q});return run(SB.from('items').update({stock:i.stock+q}).eq('id',id))}
  const c=v('ct'+id);if(c==='')return coachView();
  await SB.from('stock_log').insert({item_id:id,kind:'count',counted:+c,expected:i.stock});
  const r=await SB.from('items').update({stock:+c}).eq('id',id);
  msg=r.error?r.error.message:+c<i.stock?'Counted '+c+', system had '+i.stock+': short '+(i.stock-c)+'.':'Count saved.';coachView();
}
